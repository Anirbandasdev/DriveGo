<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="auth-wrap">
  <aside class="auth-side">
    <div class="logo">DriveGo<span class="logo-dot">.</span></div>
    <h2>Rent. Drive. Repeat.</h2>
    <p>Create an account to book in seconds and track every trip.</p>
    <ul>
      <li><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>5 locations across Kolkata</li>
      <li><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Verified, insured cars</li>
      <li><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>Free cancellation up to 24 hrs</li>
    </ul>
  </aside>
  <form class="form-card auth-form" action="my-bookings.html" method="get">
    <h2>Create Account</h2>
    <p class="muted small">Frontend only - no real registration.</p>
    <div class="field" style="margin-top:14px"><label>Full Name</label><input placeholder="Aarav Sharma" /></div>
    <div class="form-row" style="margin-top:10px">
      <div class="field"><label>Email</label><input type="email" placeholder="you@example.com" /></div>
      <div class="field"><label>Phone</label><input placeholder="+91 98765 43210" /></div>
    </div>
    <div class="form-row" style="margin-top:10px">
      <div class="field"><label>Password</label><input type="password" placeholder="••••••••" /></div>
      <div class="field"><label>Confirm Password</label><input type="password" placeholder="••••••••" /></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:14px" type="submit">Create Account</button>
    <a class="btn btn-ghost btn-block" style="margin-top:8px" href="my-bookings.html">Sign up with Google</a>
  </form>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
