<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Booking Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="confirmation" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="success-wrap">
    <div class="check"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div>
    <h2>Booking Confirmed!</h2>
    <p class="booking-id">Booking ID: <b>DG-20260915-0012</b></p>
    <div class="panel" style="text-align:left;margin-top:16px">
      <div class="kv"><span>Car</span><b id="cfCar"></b></div>
      <div class="kv"><span>Pickup</span><span id="cfPickup"></span></div>
      <div class="kv"><span>Drop</span><span id="cfDrop"></span></div>
      <div class="kv"><span>Delivery</span><span id="cfDel"></span></div>
      <div class="kv"><span>Total paid (mock)</span><b id="cfTotal"></b></div>
    </div>
    <p class="small muted icon-line" style="margin:12px 0;justify-content:center"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>Confirmation email sent to your registered email address. (simulated)</span></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-primary" href="my-bookings.html">View Booking</a>
      <button class="btn btn-ghost" onclick="window.print()">Download Receipt</button>
    </div>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
