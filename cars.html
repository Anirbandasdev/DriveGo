<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Search Cars</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="cars" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <section class="section page-head">
    <span class="eyebrow">SEARCH RESULTS</span>
    <h2 id="carsTitle">Cars available in Salt Lake</h2>
    <p class="muted" id="carsSub"></p>
  </section>

  <form class="search-card search-compact" data-search action="cars.html" method="get">
    <div class="search-grid">
      <div class="field"><label>Location</label>
        <select name="location"><option>Kolkata</option><option selected>Salt Lake</option><option>New Town</option><option>Howrah</option><option>Kolkata Airport</option></select></div>
      <div class="field"><label>Pickup date</label><input name="pickupDate" type="date" value="2026-09-15" /></div>
      <div class="field"><label>Pickup time</label><input name="pickupTime" type="time" value="10:00" /></div>
      <div class="field"><label>Drop date</label><input name="dropDate" type="date" value="2026-09-18" /></div>
      <div class="field"><label>Drop time</label><input name="dropTime" type="time" value="18:00" /></div>
      <div><button class="btn btn-primary" type="submit">Search Cars</button></div>
    </div>
  </form>

  <div class="two-col">
    <aside class="panel filter-panel">
      <h3><svg class="ic" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>Filters</h3>
      <div class="field"><label><svg class="ic" viewBox="0 0 24 24"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/></svg>Max price/day: <span id="priceVal">₹3,000</span></label>
        <input id="fPrice" type="range" min="1000" max="3000" step="100" value="3000" /></div>
      <div class="field"><label><svg class="ic" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>Car type</label>
        <select id="fType"><option>All</option><option>SUV</option><option>Hatchback</option><option>Sedan</option></select></div>
      <div class="field"><label><svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Seats</label>
        <select id="fSeats"><option>Any</option><option>5</option><option>7</option></select></div>
      <div class="field"><label><svg class="ic" viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>Transmission</label>
        <select id="fTrans"><option>Any</option><option>Automatic</option><option>Manual</option></select></div>
      <div class="field"><label><svg class="ic" viewBox="0 0 24 24"><line x1="3" x2="15" y1="22" y2="22"/><line x1="4" x2="14" y1="9" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>Fuel type</label>
        <select id="fFuel"><option>Any</option><option>Petrol</option><option>Diesel</option></select></div>
    </aside>
    <div>
      <div class="results-bar">
        <p class="muted small"><b id="carsCount">-</b> cars found</p>
        <div class="field sort-field"><label for="fSort">Sort</label>
          <select id="fSort"><option value="Recommended">Recommended</option><option value="Low">Price Low → High</option><option value="High">Price High → Low</option></select></div>
      </div>
      <div class="car-grid cols-2" id="carsGrid"></div>
    </div>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
