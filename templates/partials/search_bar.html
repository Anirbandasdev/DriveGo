{# Location + pickup + return search. Expects locations, window; optional selected (location name), all_locations (bool), variant. #}
<form class="sb{% if variant %} sb-{{ variant }}{% endif %}" action="{% url 'cars' %}" method="get" role="search">
  <label class="sb-field sb-loc">
    <span class="sb-label"><svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Pickup location</span>
    <select name="location">
      {% if all_locations %}<option value="">All locations</option>{% endif %}
      {% for loc in locations %}<option value="{{ loc.name }}"{% if selected == loc.name %} selected{% endif %}>{{ loc.name }}</option>{% endfor %}
    </select>
  </label>
  <div class="sb-field sb-when">
    <span class="sb-label"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Pickup</span>
    <div class="sb-pair">
      <input name="pickup_date" type="date" min="{% now 'Y-m-d' %}" value="{{ window.pickup_date }}" aria-label="Pickup date" required />
      <input name="pickup_time" type="time" value="{{ window.pickup_time }}" aria-label="Pickup time" />
    </div>
  </div>
  <div class="sb-field sb-when">
    <span class="sb-label"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Return</span>
    <div class="sb-pair">
      <input name="drop_date" type="date" min="{% now 'Y-m-d' %}" value="{{ window.drop_date }}" aria-label="Return date" required />
      <input name="drop_time" type="time" value="{{ window.drop_time }}" aria-label="Return time" />
    </div>
  </div>
  {% for key, value in keep_filters %}<input type="hidden" name="{{ key }}" value="{{ value }}" />{% endfor %}
  <button class="btn btn-primary sb-go" type="submit"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Search cars</span></button>
</form>
