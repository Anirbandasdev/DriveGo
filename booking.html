<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Check Availability</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="booking" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="section" style="max-width:720px">
    <div class="progress">
      <span class="p-step done"><span class="p-dot">✓</span>1. Car</span><span class="p-arrow">→</span>
      <span class="p-step now"><span class="p-dot">2</span>2. Dates</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">3</span>3. Verification</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">4</span>4. Delivery</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">5</span>5. Payment</span>
    </div>

    <h2>Check availability</h2>
    <p class="muted">Confirm your rental period for the selected car (demo data).</p>

    <div class="panel bk-car" style="margin-top:14px">
      <img id="bkImg" src="" alt="Selected car" />
      <div><h3 id="bkCarName">Car</h3><p class="small muted" id="bkCar"></p></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h3>Rental Period</h3>
      <div class="form-row">
        <div class="field"><label>Pickup date</label><input type="date" value="2026-09-15" /></div>
        <div class="field"><label>Pickup time</label><input type="time" value="10:00" /></div>
      </div>
      <div class="form-row" style="margin-top:8px">
        <div class="field"><label>Drop date</label><input type="date" value="2026-09-18" /></div>
        <div class="field"><label>Drop time</label><input type="time" value="18:00" /></div>
      </div>
      <div style="margin-top:12px"><span id="bkAvail" class="badge ok"></span></div>
    </div>

    <a class="btn btn-primary btn-block" style="margin-top:14px" href="documents.html">Continue to Verification</a>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
