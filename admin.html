<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="admin" data-nav="admin" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="section">
    <h2>Admin Dashboard <span class="badge info">demo · mock data</span></h2>
  </div>

  <div class="admin-layout">
    <aside class="sidebar">
      <a href="admin.html" class="on">Dashboard</a><a href="admin.html">Bookings</a><a href="admin.html">Cars</a>
      <a href="admin.html">Locations</a><a href="admin.html">Customers</a><a href="admin.html">Documents</a>
      <a href="admin.html">Payments</a><a href="admin.html">Settings</a>
    </aside>

    <div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></div><span class="muted small">Total Cars</span><b id="stCars">-</b></div>
        <div class="stat"><div class="stat-ico g"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></div><span class="muted small">Available Cars</span><b id="stAvail">-</b></div>
        <div class="stat"><div class="stat-ico a"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><span class="muted small">Active Bookings</span><b id="stBk">-</b></div>
        <div class="stat"><div class="stat-ico d"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></div><span class="muted small">Revenue</span><b id="stRev">-</b></div>
      </div>

      <div class="panel">
        <h3>Recent Bookings</h3>
        <div style="overflow-x:auto">
          <table>
            <tr><th>Customer</th><th>Car</th><th>Location</th><th>Dates</th><th>Amount</th><th>Status</th></tr>
            <tbody id="recentRows"></tbody>
          </table>
        </div>
      </div>

      <div class="form-row" style="margin-top:14px">
        <div class="panel"><h3>Car Availability</h3><div id="availBox"></div></div>
        <div class="panel"><h3>Location Overview</h3><div id="locBox"></div></div>
      </div>
    </div>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
