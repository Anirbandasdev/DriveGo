<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Pickup or Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="delivery" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="section flow">
    <div class="progress">
      <span class="p-step done"><span class="p-dot">✓</span>1. Car</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>2. Dates</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>3. Verification</span><span class="p-arrow">→</span>
      <span class="p-step now"><span class="p-dot">4</span>4. Delivery</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">5</span>5. Payment</span>
    </div>

    <h2>How would you like to receive your car?</h2>

    <div class="choice-cards">
      <div class="choice sel" data-method="store">
        <b><svg class="ic" viewBox="0 0 24 24"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg>Pickup from Store</b>
        <p class="small muted">Salt Lake Rental Garage, Sector V<br>Free · 9 AM - 9 PM</p>
      </div>
      <div class="choice" data-method="home">
        <b><svg class="ic" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>Home Delivery</b>
        <p class="small muted">Delivered to your door<br><b>Home delivery +₹300</b></p>
      </div>
    </div>

    <div class="panel" id="addrForm" style="display:none">
      <h3>Delivery address (demo)</h3>
      <div class="field"><label>Address</label><input value="DB-12, Sector V, Salt Lake" /></div>
      <div class="form-row" style="margin-top:8px">
        <div class="field"><label>City</label><input value="Kolkata" /></div>
        <div class="field"><label>PIN code</label><input value="700091" /></div>
      </div>
      <div class="field" style="margin-top:8px"><label>Delivery instructions</label><textarea>Call on arrival</textarea></div>
    </div>

    <a class="btn btn-primary btn-block" style="margin-top:14px" href="summary.html">Continue</a>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
