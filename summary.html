<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Booking Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="summary" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="section flow">
    <div class="progress">
      <span class="p-step done"><span class="p-dot">✓</span>1. Car</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>2. Dates</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>3. Verification</span><span class="p-arrow">→</span>
      <span class="p-step now"><span class="p-dot">4</span>4. Delivery</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">5</span>5. Payment</span>
    </div>

    <h2>Booking Summary</h2>

    <div class="panel" style="margin-top:12px">
      <div class="sum-line">
        <span class="sum-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></span>
        <div><b>Car</b><span class="muted small" id="sumCar"></span></div>
      </div>
      <div class="sum-line">
        <span class="sum-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <div><b>Pickup</b><span class="muted small" id="sumPickup"></span></div>
        <span class="sum-check"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
      </div>
      <div class="sum-line">
        <span class="sum-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <div><b>Drop-off</b><span class="muted small" id="sumDrop"></span></div>
        <span class="sum-check"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>
      </div>
      <div class="sum-line">
        <span class="sum-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></span>
        <div><b>Delivery</b></div>
        <span class="sum-val" id="sumDelivery"></span>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:10px 0" />
      <div class="kv"><span>Car rental (3 days)</span><span id="sumRent"></span></div>
      <div class="kv"><span>Delivery</span><span id="sumDel"></span></div>
      <div class="kv"><span>Taxes (18%)</span><span id="sumTax"></span></div>
      <div class="total-row"><span>Total payable</span><b id="sumTotal"></b></div>
      <a class="btn btn-primary btn-block" id="payLink" style="margin-top:14px" href="payment.html">Proceed to Payment</a>
    </div>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
