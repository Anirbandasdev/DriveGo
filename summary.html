<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveGo - Booking Summary</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="summary" data-nav="cars" data-footer="dark">

<div id="siteNav"></div>

<main class="container">
  <div class="section" style="max-width:720px">
    <div class="progress">
      <span class="p-step done"><span class="p-dot">✓</span>1. Car</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>2. Dates</span><span class="p-arrow">→</span>
      <span class="p-step done"><span class="p-dot">✓</span>3. Verification</span><span class="p-arrow">→</span>
      <span class="p-step now"><span class="p-dot">4</span>4. Delivery</span><span class="p-arrow">→</span>
      <span class="p-step"><span class="p-dot">5</span>5. Payment</span>
    </div>

    <h2>Booking Summary</h2>

    <div class="panel" style="margin-top:12px">
      <div class="kv"><span><b>Car</b><br><span class="muted small" id="sumCar"></span></span></div>
      <div class="kv"><span><b>Pickup</b><br><span class="muted small" id="sumPickup"></span></span><span>✓</span></div>
      <div class="kv"><span><b>Drop-off</b><br><span class="muted small" id="sumDrop"></span></span><span>✓</span></div>
      <div class="kv"><span><b>Delivery</b></span><span id="sumDelivery"></span></div>
      <hr style="border:none;border-top:1px solid var(--line);margin:10px 0" />
      <div class="kv"><span>Car rental (3 days)</span><span id="sumRent"></span></div>
      <div class="kv"><span>Delivery</span><span id="sumDel"></span></div>
      <div class="kv"><span>Taxes (18%)</span><span id="sumTax"></span></div>
      <div class="total-row"><span>Total payable</span><b id="sumTotal"></b></div>
      <a class="btn btn-primary btn-block" id="payLink" style="margin-top:14px" href="payment.html">Proceed to Payment</a>
    </div>
  </div>
</main>

<div id="siteFoot"></div>

<script src="data.js"></script>
<script src="components.js"></script>
<script src="site.js"></script>
</body>
</html>
